<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1f6f4a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ملاحظة">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="application-name" content="ملاحظة">
  <meta name="description" content="نظام ملاحظة كاميرات المراقبة">
  <link rel="manifest" href="/pwa/manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="/pwa/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/pwa/icons/icon-192.png">
  <title>ملاحظة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/pwa/css/app.css">
  <script>
    (function(){
      try{
        var t=localStorage.getItem('rasd_theme')||localStorage.getItem('theme');
        if(t!=='light')document.documentElement.classList.add('dark');
      }catch(e){document.documentElement.classList.add('dark');}
    })();
  </script>
</head>
<body>
  <div class="splash" id="splash">
    <div class="splash-logo">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/>
      </svg>
    </div>
    <div class="splash-text">نظام ملاحظة</div>
    <div class="splash-sub">كاميرات المراقبة</div>
  </div>

  <div id="app">
    <div id="screen-container"></div>
  </div>

  <div id="image-viewer" class="viewer hide"></div>

  <div id="share-modal" class="share-modal hide">
    <div class="share-modal-backdrop" onclick="PwaShare.close()"></div>
    <div class="share-modal-sheet">
      <div class="share-modal-header">
        <span class="share-modal-title">مشاركة</span>
        <button class="share-modal-close" onclick="PwaShare.close()" aria-label="إغلاق">
          <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="share-modal-body">
        <textarea id="share-text" rows="4" class="share-textarea" placeholder="اكتب رسالة..."></textarea>
        <div id="share-attachments-section" class="share-attach-section">
          <div class="share-attach-header">
            <span class="share-attach-label">الوسائط</span>
            <span id="share-selected-count" class="share-attach-count"></span>
          </div>
          <div id="share-attachments" class="share-attach-list"></div>
        </div>
      </div>
      <div class="share-modal-footer">
        <button id="share-copy-btn" class="share-btn share-btn-secondary" onclick="PwaShare.copyText()">نسخ</button>
        <button id="share-send-btn" class="share-btn share-btn-primary" onclick="PwaShare.send()">
          <span id="share-send-text">مشاركة</span>
        </button>
      </div>
    </div>
  </div>

  <script src="/pwa/js/api.js"></script>
  <script src="/pwa/js/auth.js"></script>
  <script src="/pwa/js/screens.js"></script>
  <script src="/pwa/js/app.js"></script>
</body>
</html>
