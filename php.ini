; حدود الرفع الخاصة بمشروع رصد — تُستخدم مع PHPRC عند تشغيل السيرفر.
;
; السبب: upload_max_filesize و post_max_size من نوع PHP_INI_PERDIR،
; أي لا يمكن تغييرهما من داخل التطبيق (ini_set يُرجع false). لذلك
; الإعداد الصحيح هو ملف php.ini خاص بالمشروع يُحمَّل عند تشغيل PHP.
;
; طريقة التشغيل: ./serve.sh  (أو: PHPRC=php.ini php artisan serve ...)

; حدود سخيّة: ملف واحد حتى 512MB، والطلب الكامل حتى 1GB.
; ملاحظة: الخادم المحلي (LAN) لا يحتاج هذا الحجم عادةً، لكنه يضمن
; ألا يُرفض أي ملف بسبب إعداد الجهاز.

upload_max_filesize = 512M
post_max_size = 1024M
max_file_uploads = 40
max_execution_time = 300
max_input_time = 300
memory_limit = 768M

; أخطاء الرفع تُعاد كنص مفهوم بدل صفحة HTML غامضة.
display_errors = Off
log_errors = On