# RASD — نقلة واحدة لسيرفر جديد (بدون تثبيت PHP/Composer/Node)
#
# الاستخدام على السيرفر الجديد:
#   git clone <repo> && cd Rasd
#   touch database/database.sqlite
#   # عدّل APP_URL في .env إلى عنوان السيرفر، مثلاً: APP_URL=http://192.168.1.50:8000
#   docker compose up -d --build
#   docker compose logs -f app   # راقب: running migrations ثم ready
#
# البيانات الدائمة على المضيف:
#   ./database/                (قاعدة SQLite + المايجريشن من git)
#   storage-private/public     (مرفقات الملاحظات والإرسالات + صور الحسابات)

services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8000}:80"
    env_file:
      - .env
    environment:
      # يزامنها entrypoint داخل .env — ضع عنوان LAN الحقيقي هنا أو في .env
      APP_URL: ${APP_URL:-http://localhost:8000}
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: "false"
    volumes:
      - ./database:/var/www/html/database
      - storage-private:/var/www/html/storage/app/private
      - storage-public:/var/www/html/storage/app/public
    healthcheck:
      test: ["CMD", "php", "artisan", "about"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # عامل الطوابير: إشعارات + ترجمة + دفع — شغّله دائماً في الإنتاج
  queue:
    build: .
    restart: unless-stopped
    entrypoint: ["sh", "-c", "sleep 15 && php artisan queue:work --sleep=3 --tries=1"]
    env_file:
      - .env
    environment:
      APP_URL: ${APP_URL:-http://localhost:8000}
      APP_ENV: ${APP_ENV:-production}
    volumes:
      - ./database:/var/www/html/database
      - storage-private:/var/www/html/storage/app/private
      - storage-public:/var/www/html/storage/app/public
    depends_on:
      - app

volumes:
  storage-private:
  storage-public:
