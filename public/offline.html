<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1f6f4a">
<title>غير متصل — ملاحظة</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',system-ui,sans-serif}
body{height:100vh;display:flex;align-items:center;justify-content:center;background:#f5f3ef;color:#1a2e1f;padding:24px}
.card{max-width:360px;width:100%;background:#fdfcfa;border:1px solid #e6e9e1;border-radius:16px;padding:32px 24px;text-align:center}
.icon{width:64px;height:64px;margin:0 auto 16px;border-radius:16px;background:#1f6f4a;display:flex;align-items:center;justify-content:center;color:#fff;font-size:28px}
h1{font-size:16px;font-weight:900;margin-bottom:8px}
p{font-size:13px;color:#6b7a6e;line-height:1.7;margin-bottom:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 20px;border-radius:12px;background:#1f6f4a;color:#fff;font-weight:700;font-size:13px;border:none;cursor:pointer;text-decoration:none}
</style>
</head>
<body>
<div class="card">
<div class="icon">📡</div>
<h1 data-ar="لا يوجد اتصال بالإنترنت" data-en="No internet connection">لا يوجد اتصال بالإنترنت</h1>
<p data-ar="التطبيق يحتاج إلى اتصال لعرض البيانات الجديدة. يمكنك المحاولة مرة أخرى عند عودة الاتصال." data-en="The app needs a connection to show new data. Please retry once you are back online.">التطبيق يحتاج إلى اتصال لعرض البيانات الجديدة. يمكنك المحاولة مرة أخرى عند عودة الاتصال.</p>
<a href="/" class="btn" onclick="location.reload();return false;" data-ar="إعادة المحاولة" data-en="Retry">إعادة المحاولة</a>
</div>
<script>(function(){try{var l=null;try{l=localStorage.getItem('rasd_locale');}catch(e){}if(!l){var m=(document.cookie.match(/(?:^|;\s*)rasd_locale=(ar|en)/)||[])[1];l=m||'ar';}if(l!=='ar'&&l!=='en')l='ar';document.documentElement.lang=l;document.documentElement.dir=(l==='ar'?'rtl':'ltr');document.title=(l==='en'?'Offline — Notes':'غير متصل — ملاحظة');document.querySelectorAll('[data-ar]').forEach(function(el){el.textContent=el.getAttribute(l==='en'?'data-en':'data-ar');});}catch(e){}})();</script>
</body>
</html>
